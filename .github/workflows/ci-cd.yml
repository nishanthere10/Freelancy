name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Principle of Least Privilege: Default token has read-only access to repository contents
permissions:
  contents: read

# Auto-cancel older runs on the same branch — only latest commit matters
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Code Quality & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Python AI microservice test suite
        run: |
          cd apps/ai
          uv pip install --system -e ".[dev]"
          pytest tests

      - name: Run unit & integration tests (TypeScript)
        run: pnpm test

      - name: Verify build compilation
        run: pnpm build
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}

  deploy:
    name: Database Migration & Production Deployment
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Render AI Service Deployment
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          echo "Triggering Render AI microservice deployment..."
          curl -X POST --fail --silent --show-error "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || echo "Warning: Render deploy hook failed"


      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @repo/database db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy API to Cloudflare Workers
        run: pnpm --filter @repo/api exec wrangler deploy --var GIT_COMMIT_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Deploy Frontend to Vercel
        run: npx -y vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}

      - name: Production Post-Deployment Health Check
        if: vars.NEXT_PUBLIC_API_URL != ''
        run: |
          echo "Verifying live production API health..."
          curl --fail --retry 3 --retry-delay 5 --silent --show-error "${{ env.API_URL }}/health" || exit 1
          echo "Health probe passed successfully."
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
